# --- KAFKA ---
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
    - port: {{ .Values.infra.kafka.port }}
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:{{ .Values.infra.kafka.port }},CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:{{ .Values.infra.kafka.port }}"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: CLUSTER_ID
              value: "DwOs6GikS6e1GtCo_QyD9A"

# --- BOOKING DATABASE ---
---
apiVersion: v1
kind: Service
metadata:
  name: booking-db
spec:
  ports:
    - port: {{ .Values.infra.database.port }}
  selector:
    app: booking-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-db
spec:
  selector:
    matchLabels:
      app: booking-db
  template:
    metadata:
      labels:
        app: booking-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.database.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.infra.database.booking.dbName }}
            - name: POSTGRES_USER
              value: {{ .Values.infra.database.booking.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.infra.database.booking.pass }}

